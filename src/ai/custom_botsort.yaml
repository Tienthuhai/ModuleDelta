# Custom BoT-SORT settings for static conveyor belt
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 60      # Số lượng frame giữ vết đối tượng khi bị mất dấu (tăng từ 30 lên 60)
match_thresh: 0.5      # Ngưỡng khớp hộp IoU (giảm từ 0.8 xuống 0.5 để hỗ trợ FPS thấp, vật di chuyển nhanh giữa các frame)
fuse_score: True       # Trộn điểm số tin cậy với khoảng cách IoU trước khi khớp (bắt buộc đối với các phiên bản ultralytics mới)

# BoT-SORT specific
gmc_method: none       # Tắt tính năng bù trừ chuyển động camera (Camera Motion Compensation). Vì camera cố định, bật cái này (mặc định sparseOptFlow) làm giảm FPS cực kỳ nhiều!
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False       # Tắt Re-ID để tránh tính toán vector đặc trưng làm chậm FPS
